<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Fırat Yaman</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/main.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Primary">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="6" class="brand-mark-bg"/>
          <path d="M8 23V9h7M8 16h5.5M18 9l3.5 6.5L25 9M21.5 15.5V23" class="brand-mark-fg"/>
        </svg>
        <span class="brand-name">Fırat Yaman</span>
      </a>
    </nav>
  </header>
  <main class="container notfound">
    <p class="eyebrow">Error 404</p>
    <h1 class="display">Page not found</h1>
    <p class="lead">This address doesn't exist on frtymn.github.io. It may have moved when the site was rebuilt.</p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="/">Go to the home page</a>
      <a class="btn btn-ghost" href="/#projects">See projects</a>

</body>
</html>
